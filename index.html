<!DOCTYPE html>
<html lang="ur" dir="ltr" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Dawat-e-Tabligh</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B4A3A">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dawat-e-Tabligh">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400..700&family=Outfit:wght@300..700&family=Amiri:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400..700&display=swap');

  :root{
    --green-deep:#0B4A3A;
    --green-mid:#146B54;
    --green-glow:#1E8F70;
    --gold:#C9A24B;
    --gold-light:#E8D9A8;
    --cream:#FBF7EC;
    --card:#FFFFFF;
    --ink:#1C2620;
    --ink-soft:#5B675F;
    --line:#E4DCC5;
    --radius:18px;
    --f-display:'Reem Kufi', sans-serif;
    --f-body:'Outfit', sans-serif;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:var(--f-body);
    background: #E9E2CE;
    color:var(--ink);
    display:flex;
    justify-content:center;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }

  body.lang-ur{ --f-display:'Noto Nastaliq Urdu', serif; --f-body:'Noto Nastaliq Urdu', serif; }
  body.lang-ur main, body.lang-ur header.top{ direction:rtl; text-align:right; }
  body.lang-ur .quick-grid, body.lang-ur .adab-list li, body.lang-ur .faq-q, body.lang-ur .sifat-head, body.lang-ur .brand-row{
    direction:rtl;
  }
  body.lang-ur .t-item{padding-left:0; padding-right:22px;}
  body.lang-ur .timeline{padding-left:0; padding-right:22px;}
  body.lang-ur .timeline::before{left:auto; right:6px;}
  body.lang-ur .t-item::before{left:auto; right:-22px;}
  body.lang-ur .note-box{border-left:none; border-right:3px solid var(--green-mid);}
  body.lang-ur .faq-a-inner{padding:0 32px 16px 2px;}
  body.lang-ur p, body.lang-ur .muted, body.lang-ur .card{line-height:2.1;}

  /* ---------- App frame ---------- */
  .app{
    width:100%;
    max-width:430px;
    min-height:100vh;
    background:var(--cream);
    position:relative;
    display:flex;
    flex-direction:column;
    box-shadow:0 0 60px rgba(11,74,58,0.25);
    overflow:hidden;
  }

  /* ---------- Language switch ---------- */
  .lang-switch{
    display:flex; gap:6px; position:relative; z-index:2; margin-top:14px;
  }
  .lang-switch button{
    flex:1; padding:7px 4px; border-radius:10px; border:1px solid rgba(232,217,168,0.45);
    background:rgba(255,255,255,0.06); color:var(--gold-light); font-family:'Outfit',sans-serif;
    font-size:12px; font-weight:600; cursor:pointer; letter-spacing:0.3px;
  }
  .lang-switch button.active{ background:var(--gold); color:var(--green-deep); border-color:var(--gold);}

  /* ---------- Geometric motif ---------- */
  header.top{
    position:relative;
    background:linear-gradient(160deg, var(--green-deep), var(--green-mid) 70%);
    color:var(--cream);
    padding:26px 20px 20px;
    z-index:1;
    overflow:hidden;
  }
  header.top .star-field{position:absolute; inset:0; opacity:0.14;}
  .brand-row{display:flex; align-items:center; gap:12px; position:relative; z-index:1;}
  .star-mark{width:38px; height:38px; flex-shrink:0;}
  .brand-text .arabic{
    font-family:'Amiri', serif; font-size:20px; letter-spacing:1px; color:var(--gold-light);
    line-height:1;
  }
  .brand-text h1{
    font-family:'Reem Kufi', sans-serif; font-weight:600; font-size:22px; letter-spacing:0.5px; margin-top:3px;
  }
  header.top p.tag{
    font-size:12.5px; color:var(--gold-light); margin-top:8px; position:relative; z-index:1; opacity:0.95;
    border-top:1px solid rgba(232,217,168,0.25); padding-top:10px;
  }

  /* ---------- Content scroll area ---------- */
  main{
    flex:1;
    overflow-y:auto;
    padding:18px 16px 100px;
    position:relative;
    z-index:1;
  }
  section.page{display:none; animation:fadeIn .35s ease;}
  section.page.active{display:block;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .eyebrow{
    font-family:var(--f-display);
    text-transform:uppercase; letter-spacing:1.5px; font-size:11px;
    color:var(--green-mid); font-weight:600; margin-bottom:6px;
  }
  body.lang-ur .eyebrow{text-transform:none; letter-spacing:0; font-size:14px;}
  h2.page-title{
    font-family:var(--f-display); font-size:23px; color:var(--green-deep);
    margin-bottom:14px; font-weight:600;
  }
  h3.block-title{
    font-family:var(--f-display); font-size:16px; color:var(--green-deep);
    margin:20px 0 10px; font-weight:600;
  }
  p{ font-size:14.5px; line-height:1.75; color:var(--ink);}
  p + p{margin-top:10px;}
  .muted{color:var(--ink-soft); font-size:13px;}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
    position:relative;
  }
  .card.gold-frame{
    border:1.5px solid var(--gold);
    background:linear-gradient(180deg,#FFFDF6,#FBF3DD);
  }

  .kalima-card{ text-align:center; padding:22px 16px;}
  .kalima-card .ar{
    font-family:'Amiri', serif; font-size:26px; color:var(--green-deep); line-height:1.9; direction:rtl;
  }
  .kalima-card .translit{ margin-top:10px; font-size:13.5px; color:var(--ink-soft); font-style:italic;}
  .corner-star{position:absolute; width:16px; height:16px; opacity:0.55;}
  .corner-star.tl{top:8px; left:8px;} .corner-star.tr{top:8px; right:8px; transform:scaleX(-1);}
  .corner-star.bl{bottom:8px; left:8px; transform:scaleY(-1);} .corner-star.br{bottom:8px; right:8px; transform:scale(-1,-1);}

  .quick-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px;}
  .quick-tile{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:14px 12px; display:flex; flex-direction:column; gap:8px; cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .quick-tile:active{transform:scale(0.97);}
  .quick-tile svg{width:22px; height:22px; color:var(--green-mid);}
  .quick-tile span{font-size:13px; font-weight:600; color:var(--ink);}

  .timeline{position:relative; padding-left:22px; margin-top:6px;}
  .timeline::before{
    content:""; position:absolute; left:6px; top:4px; bottom:4px; width:2px;
    background:linear-gradient(var(--gold), var(--green-mid));
  }
  .t-item{position:relative; padding-bottom:20px;}
  .t-item::before{
    content:""; position:absolute; left:-22px; top:2px; width:11px; height:11px; border-radius:50%;
    background:var(--gold); border:2px solid var(--cream); box-shadow:0 0 0 2px var(--green-mid);
  }
  .t-item .yr{font-family:var(--f-display); color:var(--green-deep); font-size:13px; font-weight:600;}
  .t-item p{margin-top:3px;}

  .sifat-card{
    border-radius:var(--radius); padding:16px; margin-bottom:12px;
    background:var(--card); border:1px solid var(--line);
  }
  .sifat-head{display:flex; align-items:center; gap:12px; cursor:pointer;}
  .sifat-num{
    width:34px; height:34px; border-radius:50%; background:var(--green-deep); color:var(--gold-light);
    display:flex; align-items:center; justify-content:center; font-family:var(--f-display);
    font-size:15px; flex-shrink:0;
  }
  .sifat-head h4{font-size:15.5px; color:var(--green-deep); font-family:var(--f-display); font-weight:600; flex:1;}
  .chev{width:16px; height:16px; color:var(--ink-soft); transition:transform .25s ease; flex-shrink:0;}
  .sifat-card.open .chev{transform:rotate(180deg);}
  .sifat-body{max-height:0; overflow:hidden; transition:max-height .3s ease;}
  .sifat-card.open .sifat-body{max-height:700px;}
  .sifat-body-inner{padding-top:12px;}
  .sifat-body-inner h5{font-size:12.5px; color:var(--gold); text-transform:uppercase; letter-spacing:1px; margin:10px 0 4px; font-weight:700;}
  body.lang-ur .sifat-body-inner h5{text-transform:none; letter-spacing:0; font-size:14px;}
  .sifat-body-inner h5:first-child{margin-top:2px;}

  .adab-list{list-style:none; margin-top:8px;}
  .adab-list li{
    display:flex; gap:10px; padding:11px 0; border-bottom:1px dashed var(--line); font-size:14px; line-height:1.6;
  }
  body.lang-ur .adab-list li{line-height:2;}
  .adab-list li:last-child{border-bottom:none;}
  .adab-num{
    flex-shrink:0; width:24px; height:24px; border-radius:7px; background:var(--gold-light); color:var(--green-deep);
    font-family:var(--f-display); font-size:12px; display:flex; align-items:center; justify-content:center; font-weight:700;
  }

  .faq-item{border-bottom:1px solid var(--line);}
  .faq-item:last-child{border-bottom:none;}
  .faq-q{
    display:flex; align-items:flex-start; gap:10px; padding:14px 2px; cursor:pointer;
  }
  .faq-q p{font-weight:600; font-size:14.5px; color:var(--ink); flex:1;}
  .faq-mark{
    flex-shrink:0; width:22px; height:22px; border-radius:50%; border:1.5px solid var(--green-mid);
    color:var(--green-mid); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700;
    transition:all .2s ease;
  }
  .faq-item.open .faq-mark{background:var(--green-mid); color:#fff; transform:rotate(45deg);}
  .faq-a{max-height:0; overflow:hidden; transition:max-height .3s ease;}
  .faq-item.open .faq-a{max-height:600px;}
  .faq-a-inner{padding:0 2px 16px 32px; font-size:13.8px; color:var(--ink-soft); line-height:1.75;}

  .note-box{
    background:#F2F7F1; border-left:3px solid var(--green-mid); border-radius:10px; padding:12px 14px; margin-top:10px;
    font-size:13px; color:var(--ink-soft); line-height:1.6;
  }
  body.lang-ur .note-box{line-height:2;}
  .note-box b{color:var(--green-deep);}

  .divider-star{display:flex; align-items:center; justify-content:center; gap:10px; margin:26px 0 14px;}
  .divider-star::before, .divider-star::after{content:""; height:1px; flex:1; background:var(--line);}
  .divider-star svg{width:18px; height:18px; color:var(--gold);}

  nav.bottom{
    position:absolute; bottom:0; left:0; right:0;
    background:rgba(251,247,236,0.96);
    backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    display:flex;
    z-index:5;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  nav.bottom button{
    flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:8px 2px; cursor:pointer; color:var(--ink-soft); font-family:var(--f-body);
  }
  nav.bottom button svg{width:20px; height:20px;}
  nav.bottom button span{font-size:9.5px; font-weight:600; letter-spacing:0.2px;}
  body.lang-ur nav.bottom button span{font-size:12px;}
  nav.bottom button.active{color:var(--green-deep);}
  nav.bottom button.active svg{color:var(--green-deep);}
  nav.bottom button.active span{color:var(--green-deep);}

  ::-webkit-scrollbar{width:0px;}
</style>
</head>
<body class="lang-rm">
<div class="app">

  <header class="top">
    <svg class="star-field" viewBox="0 0 400 160" preserveAspectRatio="xMidYMid slice">
      <defs>
        <pattern id="starPat" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M20 4 L24 16 L36 16 L26 23 L30 35 L20 28 L10 35 L14 23 L4 16 L16 16 Z" fill="none" stroke="#E8D9A8" stroke-width="0.7"/>
        </pattern>
      </defs>
      <rect width="400" height="160" fill="url(#starPat)"/>
    </svg>
    <div class="brand-row">
      <svg class="star-mark" viewBox="0 0 40 40" fill="none">
        <path d="M20 2 L24 15 L38 15 L27 23 L31 37 L20 28 L9 37 L13 23 L2 15 L16 15 Z" stroke="#E8D9A8" stroke-width="1.4" fill="rgba(232,217,168,0.15)"/>
      </svg>
      <div class="brand-text">
        <div class="arabic">دعوة و تبليغ</div>
        <h1>Dawat-e-Tabligh</h1>
      </div>
    </div>
    <p class="tag" data-i18n="tag"></p>
    <div class="lang-switch">
      <button data-lang="ur">اردو</button>
      <button data-lang="rm" class="active">Roman</button>
      <button data-lang="en">English</button>

  </header>

  <main id="main">

    <!-- ============ HOME ============ -->
    <section class="page active" id="page-home">
      <div class="eyebrow" data-i18n="home_eyebrow"></div>
      <h2 class="page-title" data-i18n="home_title"></h2>

      <div class="card kalima-card gold-frame">
        <svg class="corner-star tl" viewBox="0 0 20 20"><path d="M10 1 L12 8 L19 8 L13 12 L15 19 L10 14.5 L5 19 L7 12 L1 8 L8 8 Z" fill="#C9A24B"/></svg>
        <svg class="corner-star tr" viewBox="0 0 20 20"><path d="M10 1 L12 8 L19 8 L13 12 L15 19 L10 14.5 L5 19 L7 12 L1 8 L8 8 Z" fill="#C9A24B"/></svg>
        <svg class="corner-star bl" viewBox="0 0 20 20"><path d="M10 1 L12 8 L19 8 L13 12 L15 19 L10 14.5 L5 19 L7 12 L1 8 L8 8 Z" fill="#C9A24B"/></svg>
        <svg class="corner-star br" viewBox="0 0 20 20"><path d="M10 1 L12 8 L19 8 L13 12 L15 19 L10 14.5 L5 19 L7 12 L1 8 L8 8 Z" fill="#C9A24B"/></svg>
        <div class="ar">لَا إِلَهَ إِلَّا اللَّهُ مُحَمَّدٌ رَسُولُ اللَّهِ</div>

      <p data-i18n="home_p1"></p>
      <p data-i18n="home_p2"></p>

      <div class="divider-star">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1 L14.5 9 L23 9 L16 14 L18.5 22 L12 17 L5.5 22 L8 14 L1 9 L9.5 9 Z"/></svg>
      </div>

      <h3 class="block-title" data-i18n="home_maqsad_title"></h3>
      <div class="card">
        <ul class="adab-list">
          <li><span class="adab-num">1</span><span data-i18n="home_maqsad_1"></span></li>
          <li><span class="adab-num">2</span><span data-i18n="home_maqsad_2"></span></li>
          <li><span class="adab-num">3</span><span data-i18n="home_maqsad_3"></span></li>
          <li><span class="adab-num">4</span><span data-i18n="home_maqsad_4"></span></li>
        </ul>
      </div>

      <h3 class="block-title" data-i18n="home_quick_title"></h3>
      <div class="quick-grid">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
          <span data-i18n="quick_history"></span>
        </div>
        <div class="quick-tile" data-nav="sifat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2 L14.5 9 L22 9 L16 13.5 L18 21 L12 16.5 L6 21 L8 13.5 L2 9 L9.5 9 Z"/></svg>
          <span data-i18n="quick_sifat"></span>
        </div>
        <div class="quick-tile" data-nav="gasht">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 21V9l8-6 8 6v12"/><path d="M9 21v-6h6v6"/></svg>
          <span data-i18n="quick_gasht"></span>
        </div>
        <div class="quick-tile" data-nav="usool">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          <span data-i18n="quick_usool"></span>
        </div>
      </div>

      <div class="note-box" data-i18n="home_note"></div>
    </section>

    <!-- ============ HISTORY ============ -->
    <section class="page" id="page-history">
      <div class="eyebrow" data-i18n="history_eyebrow"></div>
      <h2 class="page-title" data-i18n="history_title"></h2>

      <div class="card">
        <h3 class="block-title" style="margin-top:0;" data-i18n="history_founder_title"></h3>
        <p data-i18n="history_founder_p"></p>
      </div>

      <div class="card">
        <h3 class="block-title" style="margin-top:0;" data-i18n="history_mewat_title"></h3>
        <p data-i18n="history_mewat_p1"></p>
        <p data-i18n="history_mewat_p2"></p>
      </div>

      <div class="card">
        <h3 class="block-title" style="margin-top:0;" data-i18n="history_timeline_title"></h3>
        <div class="timeline">
          <div class="t-item"><div class="yr">1885</div><p data-i18n="tl_1885"></p></div>
          <div class="t-item"><div class="yr">1926</div><p data-i18n="tl_1926"></p></div>
          <div class="t-item"><div class="yr">1944</div><p data-i18n="tl_1944"></p></div>
          <div class="t-item"><div class="yr">1965–1995</div><p data-i18n="tl_1965_1995"></p></div>
          <div class="t-item"><div class="yr">1995–2014</div><p data-i18n="tl_1995_2014"></p></div>
          <div class="t-item"><div class="yr" data-i18n="tl_today_label"></div><p data-i18n="tl_today"></p></div>
        </div>
      </div>

      <div class="note-box"><b data-i18n="history_honesty_b"></b> <span data-i18n="history_honesty_p"></span></div>

      <h3 class="block-title" data-i18n="history_raay_title"></h3>
      <div class="card">
        <p data-i18n="history_raay_p"></p>
      </div>
    </section>

      <h2 class="page-title" data-i18n="sifat_title"></h2>

        <div class="sifat-body"><div class="sifat-body-inner">
          <h5 data-i18n="label_taaruf"></h5>

          <div class="sifat-num">3</div>
          <h4 data-i18n="sifat3_name"></h4>

        </div>
        <div class="sifat-body"><div class="sifat-body-inner">
          <h5 data-i18n="label_taaruf"></h5>
          <p data-i18n="sifat3_taaruf"></p>
          <h5 data-i18n="label_hikmat"></h5>

      <div class="sifat-card" data-sifat>
        <div class="sifat-head">
          <div class="sifat-num">4</div>
          <h4 data-i18n="sifat4_name"></h4>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </div>
        <div class="sifat-body"><div class="sifat-body-inner">
          <h5 data-i18n="label_taaruf"></h5>
          <p data-i18n="sifat4_taaruf"></p>
          <h5 data-i18n="label_hikmat"></h5>
          <p data-i18n="sifat4_hikmat"></p>
        </div></div>
      </div>

      <div class="sifat-card" data-sifat>

  history_founder_title:{rm:"Baani: Maulana Muhammad Ilyas Kandhlawi (rah)", en:"Founder: Maulana Muhammad Ilyas Kandhlawi (rah)", ur:"بانی: مولانا محمد الیاس کاندھلوی رحمہ اللہ"},
  history_founder_p:{
    rm:"Paida-ish 1885 mein Kandhla, Muzaffarnagar mein. Aap ka ta'alluq ek ilmi aur mutaqi khandan se tha — aap ke walid Maulana Muhammad Ismail, Dehli ke Nizamuddin ilake ki Banglewali Masjid mein ek chhota madrasa chalate thay. Maulana Ilyas ne Darul Uloom Deoband aur Mazahir-ul-Uloom Saharanpur mein taleem paayi, aur apne daur ke bade Ulama — Sheikh-ul-Hind Maulana Mahmood Hasan, Maulana Rasheed Ahmad Gangohi aur Maulana Khalil Ahmad Saharanpuri — se ijazat o rehnumai haasil ki.",
    en:"Born in 1885 in Kandhla, Muzaffarnagar, he came from a learned and devout family — his father, Maulana Muhammad Ismail, ran a small madrasa at Banglewali Masjid in Delhi's Nizamuddin area. Maulana Ilyas studied at Darul Uloom Deoband and Mazahir-ul-Uloom Saharanpur, and received guidance and authorisation from leading scholars of his time — Sheikh-ul-Hind Maulana Mahmood Hasan, Maulana Rasheed Ahmad Gangohi and Maulana Khalil Ahmad Saharanpuri.",
    ur:"پیدائش 1885 میں کاندھلہ، مظفر نگر میں ہوئی۔ آپ کا تعلق ایک علمی اور متقی خاندان سے تھا — آپ کے والد مولانا محمد اسماعیل، دہلی کے نظام الدین علاقے کی بنگلے والی مسجد میں ایک چھوٹا مدرسہ چلاتے تھے۔ مولانا الیاس نے دارالعلوم دیوبند اور مظاہرالعلوم سہارنپور میں تعلیم پائی، اور اپنے دور کے بڑے علما — شیخ الہند مولانا محمود حسن، مولانا رشید احمد گنگوہی اور مولانا خلیل احمد سہارنپوری — سے اجازت و رہنمائی حاصل کی۔"},
  history_mewat_title:{rm:"Mewat Ka Tajurba — Kaam Ki Wajah", en:"The Mewat Experience — Why It Began", ur:"میوات کا تجربہ — کام کی وجہ"},
  history_mewat_p1:{
    rm:"Nizamuddin ke usi madrase mein taleem dete hue, Maulana Ilyas ka wasta Mewat (aaj ke Haryana/Rajasthan sarhad) ke ilake se pada, jahan ke Musalman naslon se Islam se munsalik hone ke bawajood bunyadi Kalima, Namaz aur deeni tor-tareeqon se bohot door ho chuke thay. Aap ne dekha ke madrase se taleem paakar wapas jaane wale bacche bhi wapas usi mahol mein jaakar phir se pehli halat mein aa jate — sirf madrasa kaafi nahi tha.",
    en:"While teaching at that same Nizamuddin madrasa, Maulana Ilyas came into contact with the Mewat region (near today's Haryana–Rajasthan border), where Muslims, despite generations of belonging to Islam, had drifted far from the basic Kalima, Salah and religious practice. He saw that children who studied at the madrasa and returned home would slip back into the same old ways — the madrasa alone was not enough.",
    ur:"نظام الدین کے اسی مدرسے میں تعلیم دیتے ہوئے، مولانا الیاس کا واسطہ میوات (آج کے ہریانہ راجستھان سرحد) کے علاقے سے پڑا، جہاں کے مسلمان نسلوں سے اسلام سے منسلک ہونے کے باوجود بنیادی کلمہ، نماز اور دینی طور طریقوں سے بہت دور ہو چکے تھے۔ آپ نے دیکھا کہ مدرسے سے تعلیم پا کر واپس جانے والے بچے بھی واپس اسی ماحول میں جا کر پھر سے پہلی حالت میں آ جاتے — صرف مدرسہ کافی نہیں تھا۔"},
  history_mewat_p2:{
    rm:"Isi soch ne unhein is nateeje tak pahunchaya ke Deen sirf kitabi taleem se nahi, balke khud apne waqt aur mehnat se, ghar-ghar jaakar, \"Musalman ko Musalman banane\" ki koshish se zinda hoga — jaisa Sahaba (RA) ka tareeqa raha.",
    en:"This reflection led him to conclude that faith would not be revived through book-learning alone, but through personal time and effort, going house to house, in an attempt to \"make a Muslim into a Muslim\" — the way of the Companions (RA).",
    ur:"اسی سوچ نے انہیں اس نتیجے تک پہنچایا کہ دین صرف کتابی تعلیم سے نہیں، بلکہ خود اپنے وقت اور محنت سے، گھر گھر جا کر، \"مسلمان کو مسلمان بنانے\" کی کوشش سے زندہ ہوگا — جیسا صحابہ رضی اللہ عنہم کا طریقہ رہا۔"},
  history_timeline_title:{rm:"Tareekhi Silsila", en:"Historical Timeline", ur:"تاریخی سلسلہ"},

  tl_1926:{rm:"Doosre Hajj se wapsi ke baad, Mewat mein baqaida tor par is kaam ki ibtida — chhote jamaaton ki soorat mein logon ko masajid ki taraf bulane ka silsila shuru hua.",
    en:"After returning from his second Hajj, the work formally began in Mewat — small groups started calling people towards the mosques.",
    ur:"دوسرے حج سے واپسی کے بعد، میوات میں باقاعدہ طور پر اس کام کی ابتدا — چھوٹی جماعتوں کی صورت میں لوگوں کو مساجد کی طرف بلانے کا سلسلہ شروع ہوا۔"},
  tl_1944:{rm:"Maulana Ilyas (rah) ki wafat; Maulana Muhammad Yusuf Kandhlawi (unke sahibzade) doosre Ameer muqarrar hue, jinhone kaam ko Hindustan se bahar duniya bhar tak phailaya.",
    en:"Maulana Ilyas (rah) passed away; his son Maulana Muhammad Yusuf Kandhlawi became the second Ameer and spread the work beyond India, across the world.",

  tl_1965_1995:{rm:"Maulana Inaam-ul-Hasan Kandhlawi ki qiyadat mein kaam Africa, Europe aur America tak pahuncha; Raiwind (Pakistan) aur Kakrail (Bangladesh) bade markaz bane.",

  tl_1995_2014:{rm:"Maulana Zubair-ul-Hasan Kandhlawi Ameer rahe.", en:"Maulana Zubair-ul-Hasan Kandhlawi served as Ameer.", ur:"مولانا زبیر الحسن کاندھلوی امیر رہے۔"},
  tl_today_label:{rm:"Aaj", en:"Today", ur:"آج"},
  tl_today:{rm:"Markaz Banglewali Masjid, Nizamuddin (Dehli) duniya bhar ke is kaam ka markazi hawala samjha jata hai; kaam 150 se zyada mulkon mein pahunch chuka hai. Bishwa Ijtema (Bangladesh) duniya ke sab se bade deeni ijtimaaton mein shumar hota hai.",
    en:"Banglewali Masjid, Nizamuddin (Delhi) remains the central reference point for the work worldwide; it has reached over 150 countries. The Bishwa Ijtema (Bangladesh) ranks among the largest religious gatherings in the world.",
    ur:"مرکز بنگلے والی مسجد، نظام الدین (دہلی) دنیا بھر کے اس کام کا مرکزی حوالہ سمجھا جاتا ہے؛ کام 150 سے زیادہ ممالک میں پہنچ چکا ہے۔ بشوا اجتماع (بنگلہ دیش) دنیا کے سب سے بڑے دینی اجتماعات میں شمار ہوتا ہے۔"},
  history_honesty_b:{rm:"Diyanatdari ki baat:", en:"In fairness:", ur:"دیانتداری کی بات:"},
  history_honesty_p:{rm:"2015 ke aas-paas Nizamuddin Markaz aur Alami Shura (Raiwind se munsalik) ke darmiyan qiyadat ko lekar ikhtilaf paida hua, jo abhi bhi kayi jagah jaari hai. Yeh app kisi ek fareeq ki tarafdari nahi karti — sirf maroof tareekhi tafseelat pesh kar rahi hai.",
    en:"Around 2015, a leadership dispute arose between the Nizamuddin Markaz and the Alami Shura (linked to Raiwind), which still continues in various places. This app does not take either side — it presents only well-known historical details.",
    ur:"2015 کے آس پاس نظام الدین مرکز اور عالمی شوریٰ (رائے ونڈ سے منسلک) کے درمیان قیادت کو لے کر اختلاف پیدا ہوا، جو ابھی بھی کئی جگہ جاری ہے۔ یہ ایپ کسی ایک فریق کی طرفداری نہیں کرتی — صرف معروف تاریخی تفصیلات پیش کر رہی ہے۔"},
  history_raay_title:{rm:"Kis Ki Raay Se Shuru Hua?", en:"On Whose Advice Did It Begin?", ur:"کس کی رائے سے شروع ہوا؟"},
  history_raay_p:{rm:"Maulana Ilyas (rah) ne yeh kaam achanak ya akele shuru nahi kiya. Riwayat ke mutabiq unhone apne bade Ustazon aur us daur ke maroof Ulama se mashwara aur ijazat li, aur baar-baar dua aur ghor-o-fikr ke baad hi is kaam ki ibtida ki. Unka maqsad koi naya firqa banana nahi tha, balke maujooda Ummat ke andar Iman ki wapas aabadkari thi — is liye unhone shuru se hi is kaam ko \"tehreek\" ya \"jamaat\" ka naam dene se guraiz kiya aur ise sirf ek \"mehnat\" (koshish) kaha.",
    en:"Maulana Ilyas (rah) did not begin this work suddenly or alone. According to traditional accounts, he consulted and sought permission from his senior teachers and the well-known scholars of his time, and began the work only after repeated prayer and reflection. His aim was not to create a new sect, but to restore faith within the existing Ummah — which is why, from the start, he avoided calling it a \"movement\" or \"organisation\" and referred to it simply as a \"mehnat\" (effort).",
    ur:"مولانا الیاس رحمہ اللہ نے یہ کام اچانک یا اکیلے شروع نہیں کیا۔ روایت کے مطابق انہوں نے اپنے بڑے استادوں اور اس دور کے معروف علما سے مشورہ اور اجازت لی، اور بار بار دعا اور غور و فکر کے بعد ہی اس کام کی ابتدا کی۔ ان کا مقصد کوئی نیا فرقہ بنانا نہیں تھا، بلکہ موجودہ امت کے اندر ایمان کی واپس آبادکاری تھی — اسی لیے انہوں نے شروع سے ہی اس کام کو \"تحریک\" یا \"جماعت\" کا نام دینے سے گریز کیا اور اسے صرف ایک \"محنت\" (کوشش) کہا۔"},

  sifat_eyebrow:{rm:"Buniyaadi Taleem", en:"Core Teaching", ur:"بنیادی تعلیم"},
  sifat_title:{rm:"Chhe Sifaat (6 Points)", en:"The Six Points", ur:"چھے صفات"},
  sifat_intro:{rm:"Yeh chhe sifaat khud koi mustaqil hadees ki ibarat nahi hain — balke Sahaba (RA) ki zindagi mein paayi jaane wali un sifaat ka khulasa hain jo Quran-o-Hadees ki mukhtalif taleemat se maloom hoti hain. Maulana Ilyas aur baad mein Maulana Yusuf (rah) ne inhein aasan tarteeb mein murattab kiya taake har aam Musalman inhein yaad rakh kar apni zindagi mein utaar sake.",
    en:"These six points are not, in themselves, a fixed piece of hadith text — rather, they are a summary of qualities found in the lives of the Companions (RA), drawn from various teachings of the Quran and Hadith. Maulana Ilyas, and later Maulana Yusuf (rah), arranged them in this simple order so ordinary Muslims could remember and apply them in daily life.",
    ur:"یہ چھے صفات خود کوئی مستقل حدیث کی عبارت نہیں ہیں — بلکہ صحابہ رضی اللہ عنہم کی زندگی میں پائی جانے والی ان صفات کا خلاصہ ہیں جو قرآن و حدیث کی مختلف تعلیمات سے معلوم ہوتی ہیں۔ مولانا الیاس اور بعد میں مولانا یوسف رحمہما اللہ نے انہیں آسان ترتیب میں مرتب کیا تاکہ ہر عام مسلمان انہیں یاد رکھ کر اپنی زندگی میں اتار سکے۔"},

  label_taaruf:{rm:"Ta'aruf", en:"Meaning", ur:"تعارف"},
  label_hikmat:{rm:"Hikmat", en:"Wisdom", ur:"حکمت"},

  sifat1_name:{rm:"Kalima (Iman)", en:"Kalima (Faith)", ur:"کلمہ (ایمان)"},
  sifat1_taaruf:{rm:"La ilaha illallah Muhammadur Rasulullah — is yaqeen ka dil mein pukhta hona ke izzat, madad aur kamiyaabi sirf Allah ki taraf se hai, aur zindagi guzarne ka mukammal tareeqa sirf Rasoolullah ﷺ ka laaya hua tareeqa hai.",
    en:"There is no god but Allah, Muhammad is His Messenger — a firm conviction that honour, help and success come from Allah alone, and that the complete way of life is the one brought by the Messenger ﷺ.",
    ur:"لا الہ الا اللہ محمد رسول اللہ — اس یقین کا دل میں پختہ ہونا کہ عزت، مدد اور کامیابی صرف اللہ کی طرف سے ہے، اور زندگی گزارنے کا مکمل طریقہ صرف رسول اللہ ﷺ کا لایا ہوا طریقہ ہے۔"},
  sifat1_hikmat:{rm:"Jab tak yeh yaqeen zabaan se aage badh kar dil mein na utre, koi bhi amal apni asal rooh nahi paata. Isi liye ise sab se pehle rakha gaya — baaqi tamam sifaat isi Iman ki shaakhein hain.",
    en:"Until this conviction moves beyond the tongue and settles in the heart, no action carries its true spirit. This is why it is placed first — every other point is a branch of this same faith.",
    ur:"جب تک یہ یقین زبان سے آگے بڑھ کر دل میں نہ اترے، کوئی بھی عمل اپنی اصل روح نہیں پاتا۔ اسی لیے اسے سب سے پہلے رکھا گیا — باقی تمام صفات اسی ایمان کی شاخیں ہیں۔"},

  sifat2_name:{rm:"Namaz Ba-Khushu-o-Khuzu", en:"Prayer with Concentration", ur:"نماز باخشوع و خضوع"},
  sifat2_taaruf:{rm:"Namaz sirf zahiri arkaan poori karna nahi, balke dil ki hazri aur tawajjo ke saath, uske huqooq aur sunnaton ka lihaz rakhte hue ada karna.",
    en:"Prayer is not merely completing the outward movements, but performing it with presence of heart and attention, observing its rights and its Sunnah.",
    ur:"نماز صرف ظاہری ارکان پوری کرنا نہیں، بلکہ دل کی حاضری اور توجہ کے ساتھ، اس کے حقوق اور سنتوں کا لحاظ رکھتے ہوئے ادا کرنا۔"},
  sifat2_hikmat:{rm:"Namaz momin aur Allah ke darmiyan roz ka mulaqaat hai. Jab yeh mulaqaat sirf aadat ban jaye to dil se asar khatam ho jata hai — isi liye is sifat mein \"khushu-o-khuzu\" (tawajjo aur inkisari) par zor diya jata hai, na ke sirf namaz ada karne par.",
    en:"Prayer is the believer's daily meeting with Allah. When this meeting becomes mere habit, its inner effect fades — which is why this point stresses concentration and humility, not just the outward performance of prayer.",
    ur:"نماز مومن اور اللہ کے درمیان روز کی ملاقات ہے۔ جب یہ ملاقات صرف عادت بن جائے تو دل سے اثر ختم ہو جاتا ہے — اسی لیے اس صفت میں \"خشوع و خضوع\" (توجہ اور انکساری) پر زور دیا جاتا ہے، نہ کہ صرف نماز ادا کرنے پر۔"},

  sifat3_name:{rm:"Ilm o Zikr", en:"Knowledge & Remembrance", ur:"علم و ذکر"},
  sifat3_taaruf:{rm:"Ilm — apne rozmarra amal ke liye zaroori deeni maloomat haasil karna; Zikr — Allah ko har waqt yaad rakhna taake amal sahih niyat aur hazri-e-qalb ke saath ho.",
    en:"Ilm — acquiring the religious knowledge needed for daily practice; Zikr — remembering Allah at all times so that action is done with sincere intention and presence of heart.",
    ur:"علم — اپنے روزمرہ عمل کے لیے ضروری دینی معلومات حاصل کرنا؛ ذکر — اللہ کو ہر وقت یاد رکھنا تاکہ عمل صحیح نیت اور حاضریٔ قلب کے ساتھ ہو۔"},
  sifat3_hikmat:{rm:"Maulana Yusuf (rah) ke mutabiq Ilm aur Zikr ko is liye saath rakha gaya ke sirf Ilm bagair Zikr ke khushk (dry) reh sakta hai, aur sirf Zikr bagair Ilm ke sahih rukh nahi le pata. Dono milkar amal ko roohaniyat aur sehat dono ata karte hain.",
    en:"According to Maulana Yusuf (rah), knowledge and remembrance are paired because knowledge alone, without remembrance, can turn dry, while remembrance alone, without knowledge, can lose its right direction. Together they give action both spirit and soundness.",
    ur:"مولانا یوسف رحمہ اللہ کے مطابق علم اور ذکر کو اس لیے ساتھ رکھا گیا کہ صرف علم بغیر ذکر کے خشک رہ سکتا ہے، اور صرف ذکر بغیر علم کے صحیح رخ نہیں لے پاتا۔ دونوں مل کر عمل کو روحانیت اور صحت دونوں عطا کرتے ہیں۔"},

  sifat4_name:{rm:"Ikram-e-Muslim", en:"Honouring Muslims", ur:"اکرامِ مسلم"},
  sifat4_taaruf:{rm:"Har Musalman ki izzat karna, uska haq ada karna aur apna haq chhod dena, chhote-bade, ameer-ghareeb sab ka lihaz rakhna.",
    en:"Honouring every Muslim, fulfilling their rights and setting aside one's own, showing consideration to young and old, rich and poor alike.",
    ur:"ہر مسلمان کی عزت کرنا، اس کا حق ادا کرنا اور اپنا حق چھوڑ دینا، چھوٹے بڑے، امیر غریب سب کا لحاظ رکھنا۔"},
  sifat4_hikmat:{rm:"Jab tak Ummat ke andar aapas mein ikraam aur narmi na ho, dawat ka asar khud Musalmanon par bhi nahi padta. Yeh sifat Ummat ko andar se jorne aur bhai-chaara paida karne ke liye rakhi gayi.",
    en:"Until there is mutual honour and gentleness within the Ummah, the call of dawah does not even affect Muslims themselves. This point exists to bind the Ummah together from within and build brotherhood.",
    ur:"جب تک امت کے اندر آپس میں اکرام اور نرمی نہ ہو، دعوت کا اثر خود مسلمانوں پر بھی نہیں پڑتا۔ یہ صفت امت کو اندر سے جوڑنے اور بھائی چارہ پیدا کرنے کے لیے رکھی گئی۔"},

  sifat5_name:{rm:"Ikhlas-e-Niyyat", en:"Sincerity of Intention", ur:"اخلاصِ نیت"},
  sifat5_taaruf:{rm:"Har amal sirf Allah ki raza ke liye karna, dikhawe (riya) aur naam-o-namood se bachna.",
    en:"Doing every act solely for Allah's pleasure, avoiding showing off and seeking reputation.",
    ur:"ہر عمل صرف اللہ کی رضا کے لیے کرنا، دکھاوے (ریا) اور نام و نمود سے بچنا۔"},
  sifat5_hikmat:{rm:"Amal ki qadr Allah ke nazdeek uski niyyat se hoti hai, uski miqdaar se nahi. Isi liye har kaam se pehle, darmiyan aur baad mein apni niyyat ka jaiza lene ki taleem di jati hai.",
    en:"An action's worth before Allah lies in its intention, not its size. This is why one is taught to examine one's intention before, during and after every act.",
    ur:"عمل کی قدر اللہ کے نزدیک اس کی نیت سے ہوتی ہے، اس کی مقدار سے نہیں۔ اسی لیے ہر کام سے پہلے، درمیان اور بعد میں اپنی نیت کا جائزہ لینے کی تعلیم دی جاتی ہے۔"},

  sifat6_name:{rm:"Dawat-o-Tabligh (Waqt Lagana)", en:"Dawah & Tabligh (Giving Time)", ur:"دعوت و تبلیغ (وقت لگانا)"},
  sifat6_taaruf:{rm:"Allah ke diye hue waqt, maal aur zindagi ka kuch hissa Deen ki dawat ke liye nikalna — khud bhi seekhna aur dusron tak bhi pahunchana.",
    en:"Setting aside a portion of the time, wealth and life Allah has given, for the cause of dawah — learning oneself and conveying it to others.",
    ur:"اللہ کے دیے ہوئے وقت، مال اور زندگی کا کچھ حصہ دین کی دعوت کے لیے نکالنا — خود بھی سیکھنا اور دوسروں تک بھی پہنچانا۔"},
  sifat6_hikmat:{rm:"Insaan jis cheez mein apna waqt aur mehnat lagata hai, wahi cheez uski asal fikr ban jati hai. Jab koi Deen ki dawat ke liye waqt nikalta hai to yeh amal khud usi ke Iman ko mazboot karta hai — pehle asar dene wale par hota hai, phir sunne wale par.",
    en:"Whatever a person invests time and effort in becomes their true concern. When someone gives time for the sake of dawah, the act itself strengthens their own faith first, before it affects the listener.",
    ur:"انسان جس چیز میں اپنا وقت اور محنت لگاتا ہے، وہی چیز اس کی اصل فکر بن جاتی ہے۔ جب کوئی دین کی دعوت کے لیے وقت نکالتا ہے تو یہ عمل خود اسی کے ایمان کو مضبوط کرتا ہے — پہلے اثر دینے والے پر ہوتا ہے، پھر سننے والے پر۔"},
  sifat6_doubt:{rm:"Doubt: kya yeh Quran-Hadees se sabit hai ke waqt nikal kar dawat ke liye nikalna zaroori hai? — Jawab: Dawat dena Quran ki roshni mein har Momin ki zimmedari hai (\"Ud'u ila sabili Rabbika\" — apne Rab ke raste ki taraf bulao). \"Kitna waqt aur kis tareeqe se\" — yeh tafseel ijtihadi aur tanzeemi soch hai jo waqt ke sath tay ki gayi, khud koi nass nahi.",
    en:"Doubt: Is it proven from the Quran and Hadith that setting aside fixed time for dawah is obligatory? — Answer: Calling others to the faith is, in light of the Quran, every believer's responsibility (\"Invite to the way of your Lord\"). But the specific amount of time and method is a matter of scholarly reasoning and organisational planning developed over time — not a direct Quranic or Hadith text in itself.",
    ur:"شبہ: کیا یہ قرآن و حدیث سے ثابت ہے کہ وقت نکال کر دعوت کے لیے نکلنا ضروری ہے؟ — جواب: دعوت دینا قرآن کی روشنی میں ہر مومن کی ذمہ داری ہے (\"ادعُ الیٰ سبیل ربک\" — اپنے رب کے راستے کی طرف بلاؤ)۔ \"کتنا وقت اور کس طریقے سے\" — یہ تفصیل اجتہادی اور تنظیمی سوچ ہے جو وقت کے ساتھ طے کی گئی، خود کوئی نص نہیں۔"},

  gasht_eyebrow:{rm:"Amal Ka Tareeqa", en:"Method of Practice", ur:"عمل کا طریقہ"},
  gasht_title:{rm:"Gasht Ke Adaab", en:"Etiquette of the Rounds", ur:"گشت کے آداب"},
  gasht_intro:{rm:"Gasht (ya Joula) — masjid ke aas-paas ke logon ko namaz aur deen ki taraf narmi se bulane ka amal. Neeche wo bunyadi adaab hain jo aam taur par sikhaaye jate hain; ye mahal aur mashware ke mutabiq kam-zyada ho sakte hain.",
    en:"Gasht (or Joula) is the practice of gently inviting people around a mosque towards prayer and the faith. Below are the basic points of etiquette generally taught; these may vary by local custom and consultation.",
    ur:"گشت (یا جولہ) — مسجد کے آس پاس کے لوگوں کو نماز اور دین کی طرف نرمی سے بلانے کا عمل۔ نیچے وہ بنیادی آداب ہیں جو عام طور پر سکھائے جاتے ہیں؛ یہ مقام اور مشورے کے مطابق کم زیادہ ہو سکتے ہیں۔"},
  gasht_note:{rm:"<b>Yaad rahe:</b> Gasht ka maqsad kisi ko \"shikast\" dena ya bahas mein jeetna nahi — sirf mohabbat se yaad dilana hai. Jo baatein in adaab mein shamil nahi (jaise kisi khaas jumle ka rasm ban jaana, ya kisi khaas tarz-e-guftagu ko zaroori samajhna) unhein mahaz \"mahal ka riwaj\" samjha jaana chahiye, deen ka hukm nahi.",
    en:"<b>Remember:</b> The purpose of gasht is not to \"defeat\" anyone or win an argument — only to remind with love. Anything not included in these points (such as a particular phrase becoming a fixed ritual, or a specific manner of speaking being treated as compulsory) should be understood as local custom, not a command of the faith.",
    ur:"<b>یاد رہے:</b> گشت کا مقصد کسی کو \"شکست\" دینا یا بحث میں جیتنا نہیں — صرف محبت سے یاد دلانا ہے۔ جو باتیں ان آداب میں شامل نہیں (جیسے کسی خاص جملے کا رسم بن جانا، یا کسی خاص طرزِ گفتگو کو ضروری سمجھنا) انہیں محض \"مقام کا رواج\" سمجھا جانا چاہیے، دین کا حکم نہیں۔"},

  usool_eyebrow:{rm:"Nazm-o-Nasq", en:"Structure", ur:"نظم و نسق"},
  usool_title:{rm:"Usool o Zawabit", en:"Rules & Regulations", ur:"اصول و ضوابط"},
  usool1_title:{rm:"Waqt Ki Miqdaarein", en:"Amounts of Time", ur:"وقت کی مقداریں"},
  usool1_p:{rm:"Kaam mein shirkat ke liye alag-alag miqdaar ka waqt tajweez kiya jata hai — rozana ka waqt (masjid mein ta'leem/mashwara), haftay mein ek din, maheene mein teen din, saal mein chalees din (chillah), aur zindagi mein ek martaba chaar mahine. Yeh sab ikhtiyari hai — koi bhi shakl farz ya majburi nahi.",
    en:"Different amounts of time are suggested for participation — a daily portion (study/consultation at the mosque), one day a week, three days a month, forty days a year (chillah), and four months once in a lifetime. All of this is voluntary — none of it is obligatory.",
    ur:"کام میں شرکت کے لیے مختلف مقدار کا وقت تجویز کیا جاتا ہے — روزانہ کا وقت (مسجد میں تعلیم/مشورہ)، ہفتے میں ایک دن، مہینے میں تین دن، سال میں چالیس دن (چلہ)، اور زندگی میں ایک مرتبہ چار مہینے۔ یہ سب اختیاری ہے — کوئی بھی شکل فرض یا مجبوری نہیں۔"},
  usool2_title:{rm:"Mashwara (Consultation)", en:"Mashwara (Consultation)", ur:"مشورہ"},
  usool2_p:{rm:"Har faisla mile-julkar mashware se hota hai — chahe woh Ameer ka intekhab ho ya kisi jamaat ka rukh. Ameer ki ita'at Shariah ki hudood ke andar zaroori samjhi jati hai, lekin koi bhi rasmi \"ohda\" ya tanzeemi darja-bandi nahi hoti — sab kaarkun (worker) samjhe jate hain.",
    en:"Every decision is made collectively through consultation — whether choosing an Ameer or a group's direction. Obedience to the Ameer, within the limits of the Shariah, is considered necessary, but there is no formal \"office\" or organisational hierarchy — everyone is regarded simply as a worker.",
    ur:"ہر فیصلہ مل جل کر مشورے سے ہوتا ہے — چاہے وہ امیر کا انتخاب ہو یا کسی جماعت کا رخ۔ امیر کی اطاعت شریعت کی حدود کے اندر ضروری سمجھی جاتی ہے، لیکن کوئی بھی رسمی \"عہدہ\" یا تنظیمی درجہ بندی نہیں ہوتی — سب کارکن سمجھے جاتے ہیں۔"},
  usool3_title:{rm:"Ta'leem", en:"Ta'leem (Study Sessions)", ur:"تعلیم"},
  usool3_p:{rm:"Har namaz ke baad kuch waqt Fazail-e-A'maal, Muntakhab Ahadees ya Hayat-us-Sahaba jaisi kitabon se ta'leem ke liye rakha jata hai, taake Sahaba (RA) ki zindagi aur amal ke fazail se ta'alluq mazboot ho.",
    en:"After every prayer, a short time is set aside to read from books such as Fazail-e-A'maal, Muntakhab Ahadith or Hayat-us-Sahaba, so that one's connection to the lives and virtues of the Companions (RA) is strengthened.",
    ur:"ہر نماز کے بعد کچھ وقت فضائلِ اعمال، منتخب احادیث یا حیاتُ الصحابہ جیسی کتابوں سے تعلیم کے لیے رکھا جاتا ہے، تاکہ صحابہ رضی اللہ عنہم کی زندگی اور عمل کے فضائل سے تعلق مضبوط ہو۔"},
  usool4_title:{rm:"Masturat (Khawateen) Ka Kaam", en:"The Work of Women (Masturat)", ur:"مستورات (خواتین) کا کام"},

const FAQ_LIST = [
  { q:{rm:"Sahaba (RA) ne to kafiron ko dawat di thi, hum Musalmanon ko hi kyun dawat de rahe hain?",
       en:"The Companions (RA) invited disbelievers to Islam — why are we inviting Muslims instead?",
       ur:"صحابہ رضی اللہ عنہم نے تو کافروں کو دعوت دی تھی، ہم مسلمانوں کو ہی کیوں دعوت دے رہے ہیں؟"},
    a:{rm:"Sahaba (RA) ne dono kaam kiye — ghair-Muslimon ko Islam ki dawat bhi, aur khud Musalmanon ki tarbiyat-o-islah bhi (jaisa Rasoolullah ﷺ khud Sahaba ki tarbiyat karte thay). Aaj bohot se log naam ke Musalman hain jinhein bunyadi Kalima-Namaz tak nahi aata — is liye pehli tawajjo apne andar ki islah par di gayi, taake mazboot Musalman phir Deen ko aage bhi pahuncha sakein. Ghair-Muslimon ko dawat dena is kaam se khaarij nahi — bohot se log Tablighi mehnat ke zariye Islam laaye hain — lekin \"pehle apna ghar\" ka usool ibtidai tawajjo ka sabab bana.",
       en:"The Companions (RA) did both — they invited disbelievers to Islam, and they also trained and reformed fellow Muslims, just as the Messenger ﷺ trained his own Companions. Today, many people are Muslim in name only and don't even know the basics of the Kalima and prayer — so the first focus was placed on internal reform, so that strengthened Muslims could then carry the faith further. Inviting non-Muslims is not excluded from this work — many have accepted Islam through Tablighi efforts — but the principle of \"fix your own house first\" shaped the initial focus.",
       ur:"صحابہ رضی اللہ عنہم نے دونوں کام کیے — غیر مسلموں کو اسلام کی دعوت بھی، اور خود مسلمانوں کی تربیت و اصلاح بھی (جیسا رسول اللہ ﷺ خود صحابہ کی تربیت کرتے تھے)۔ آج بہت سے لوگ نام کے مسلمان ہیں جنہیں بنیادی کلمہ نماز تک نہیں آتا — اس لیے پہلی توجہ اپنے اندر کی اصلاح پر دی گئی، تاکہ مضبوط مسلمان پھر دین کو آگے بھی پہنچا سکیں۔ غیر مسلموں کو دعوت دینا اس کام سے خارج نہیں — بہت سے لوگ تبلیغی محنت کے ذریعے اسلام لائے ہیں — لیکن \"پہلے اپنا گھر\" کا اصول ابتدائی توجہ کا سبب بنا۔"} },

  { q:{rm:"Kya is Jamaat mein shamil hona Shariah mein farz hai?", en:"Is joining this Jamaat obligatory in Shariah?", ur:"کیا اس جماعت میں شامل ہونا شریعت میں فرض ہے؟"},
    a:{rm:"Nahi. Yeh ek dawati koshish hai, farz ya wajib nahi. Shirkat mukammal taur par ikhtiyari hai.",
       en:"No. This is a voluntary outreach effort, not an obligation. Participation is entirely optional.",
       ur:"نہیں۔ یہ ایک دعوتی کوشش ہے، فرض یا واجب نہیں۔ شرکت مکمل طور پر اختیاری ہے۔"} },

  { q:{rm:"Fazail-e-A'maal ki riwayaat kamzor (zaeef) hoti hain — kya yeh sahih hai?", en:"Fazail-e-A'maal's narrations are said to be weak (za'eef) — is this true?", ur:"فضائلِ اعمال کی روایات کمزور (ضعیف) ہوتی ہیں — کیا یہ صحیح ہے؟"},
    a:{rm:"Kitaab mein zyada tar riwayaat \"fazail\" (amal ki fazilat/targheeb) se ta'alluq rakhti hain, \"masael\" (Shariah ke ahkaam) se nahi. Bohot se Muhaddiseen ke nazdeek zaeef riwayat sirf targheeb ke liye — jab woh kisi masla ya aqeeda ka bayan na kar rahi ho — jaiz samjhi jaati hai. Isi usool par yeh kitaab murattab ki gayi hai.",
       en:"Most narrations in the book relate to \"fazail\" (virtues and encouragement of good deeds), not \"masael\" (legal rulings). Many hadith scholars hold that a weak narration is permissible when used purely for encouragement — where it does not establish a ruling or belief. The book was compiled on this principle.",
       ur:"کتاب میں زیادہ تر روایات \"فضائل\" (عمل کی فضیلت/ترغیب) سے تعلق رکھتی ہیں، \"مسائل\" (شریعت کے احکام) سے نہیں۔ بہت سے محدثین کے نزدیک ضعیف روایت صرف ترغیب کے لیے — جب وہ کسی مسئلے یا عقیدے کا بیان نہ کر رہی ہو — جائز سمجھی جاتی ہے۔ اسی اصول پر یہ کتاب مرتب کی گئی ہے۔"} },

  { q:{rm:"Kya sirf Tablighi Jamaat ka tareeqa hi sahih Deen hai, baaki sab ghalat?", en:"Is the Tablighi Jamaat's way the only correct path, and everything else wrong?", ur:"کیا صرف تبلیغی جماعت کا طریقہ ہی صحیح دین ہے، باقی سب غلط؟"},
    a:{rm:"Nahi — Tablighi Jamaat khud ko koi naya firqa ya mustaqil \"jamaat\" nahi maanti, balke Ummat ki bunyadi islah ki ek \"mehnat\" samjhti hai. Kayi Ulama-e-Deoband aur ahle-sunnat ke Ulama ne is kaam ko mustahsan qaraar diya hai. Lekin yeh bhi sach hai ke kuch doosre Ulama aur maktab-e-fikr (khaas kar Ahle Hadees/Salafi rujhaan rakhne wale) is tareeqe, khaas kar Fazail-e-A'maal ki chand riwayaat aur tanzeemi tareeqa-e-kaar par, tanqeed bhi karte hain. Is app mein Tablighi taleemat unki apni zabaan mein pesh ki gayi hain — is par Ulama mein ikhtilaf mojood hai, aur har Musalman ko apni tehqeeq aur apne mo'tabar Ulama se rehnumai lene ki targheeb di jati hai.",
       en:"No — the Tablighi Jamaat does not consider itself a new sect or a formal \"organisation,\" but sees itself as one effort at the Ummah's basic reform. Many Deobandi and other Ahl-e-Sunnah scholars have endorsed this work. But it is also true that some other scholars and schools of thought (particularly those with an Ahl-e-Hadith/Salafi orientation) criticise this approach, especially certain narrations in Fazail-e-A'maal and aspects of its organisational method. This app presents Tablighi teachings in their own terms — scholars differ on this, and every Muslim is encouraged to seek guidance from their own trusted scholars.",
       ur:"نہیں — تبلیغی جماعت خود کو کوئی نیا فرقہ یا مستقل \"جماعت\" نہیں مانتی، بلکہ امت کی بنیادی اصلاح کی ایک \"محنت\" سمجھتی ہے۔ کئی علمائے دیوبند اور اہلِ سنت کے علما نے اس کام کو مستحسن قرار دیا ہے۔ لیکن یہ بھی سچ ہے کہ کچھ دوسرے علما اور مکتبِ فکر (خاص کر اہلِ حدیث/سلفی رجحان رکھنے والے) اس طریقے، خاص کر فضائلِ اعمال کی چند روایات اور تنظیمی طریقہ کار پر، تنقید بھی کرتے ہیں۔ اس ایپ میں تبلیغی تعلیمات ان کی اپنی زبان میں پیش کی گئی ہیں — اس پر علما میں اختلاف موجود ہے، اور ہر مسلمان کو اپنی تحقیق اور اپنے معتبر علما سے رہنمائی لینے کی ترغیب دی جاتی ہے۔"} },

  { q:{rm:"Chaar mahine ya chillay ke liye ghar-parivar chhodna — kya ghar walon ka haq nahi marta?", en:"Leaving family for four months or a chillah — doesn't this neglect the family's rights?", ur:"چار مہینے یا چلے کے لیے گھر پریوار چھوڑنا — کیا گھر والوں کا حق نہیں مرتا؟"},
    a:{rm:"Taleem mein zor diya jata hai ke pehle ghar walon ki razamandi li jaye aur unki zaroori zimmedariyan (kharch, hifazat) poori karke hi waqt nikala jaye. Shariah mein ghar walon ka haq ada karna khud ek zaroori amal hai — is liye is baat ka khaas khayal rakhne ki talqeen ki jaati hai.",
       en:"The teaching emphasises taking the family's consent first, and ensuring their necessary needs (expenses, safety) are arranged for before giving time. Fulfilling the rights of one's family is itself a necessary act in the Shariah — so this is stressed with particular care.",
       ur:"تعلیم میں زور دیا جاتا ہے کہ پہلے گھر والوں کی رضامندی لی جائے اور ان کی ضروری ذمہ داریاں (خرچ، حفاظت) پوری کر کے ہی وقت نکالا جائے۔ شریعت میں گھر والوں کا حق ادا کرنا خود ایک ضروری عمل ہے — اس لیے اس بات کا خاص خیال رکھنے کی تلقین کی جاتی ہے۔"} },

  { q:{rm:"Kya jamaat mein shamil hone ke liye madrasa ki taleem zaroori hai?", en:"Is madrasa education required to join the Jamaat?", ur:"کیا جماعت میں شامل ہونے کے لیے مدرسے کی تعلیم ضروری ہے؟"},
    a:{rm:"Nahi. Har aam Musalman — chahe woh aalim ho ya na ho — shamil ho sakta hai. Sirf Kalima aur namaz ka bunyadi ilm kaafi samjha jata hai, baaqi seekhte-seekhte hasil hota hai.",
       en:"No. Any ordinary Muslim — scholar or not — can join. Basic knowledge of the Kalima and prayer is considered sufficient; the rest is learned along the way.",
       ur:"نہیں۔ ہر عام مسلمان — چاہے وہ عالم ہو یا نہ ہو — شامل ہو سکتا ہے۔ صرف کلمہ اور نماز کا بنیادی علم کافی سمجھا جاتا ہے، باقی سیکھتے سیکھتے حاصل ہوتا ہے۔"} },

  { q:{rm:"Kya gasht mein logon par dabaav ya zabardasti ki jati hai?", en:"Is pressure or force used on people during gasht?", ur:"کیا گشت میں لوگوں پر دباؤ یا زبردستی کی جاتی ہے؟"},
    a:{rm:"Sikhaya yeh jata hai ke sirf narmi, mohabbat aur ikhtiyar ke saath dawat di jaye. Jawab \"na\" milne par bhi khushdili se dua deke wapas hona adab ka hissa hai — zabardasti is tareeqe mein shamil nahi.",

  { q:{rm:"Kya yeh kaam siyasi maqsad rakhta hai?", en:"Does this work have political aims?", ur:"کیا یہ کام سیاسی مقصد رکھتا ہے؟"},
    a:{rm:"Nahi. Is kaam ka elaan-shuda maqsad sirf Iman aur amal ki islah hai; siyasi ya samaji tehreekon mein seedhi shirkat is tareeqe ka hissa nahi rakhi gayi, taake mukhtalif soch ke log bina ikhtilaf ke is kaam mein shamil ho sakein.",
       en:"No. The stated purpose of this work is solely the reform of faith and practice; direct involvement in political or social movements has not been made part of this method, so that people of different views can take part without dispute.",
       ur:"نہیں۔ اس کام کا اعلان شدہ مقصد صرف ایمان اور عمل کی اصلاح ہے؛ سیاسی یا سماجی تحریکوں میں سیدھی شرکت اس طریقے کا حصہ نہیں رکھی گئی، تاکہ مختلف سوچ کے لوگ بغیر اختلاف کے اس کام میں شامل ہو سکیں۔"} }

   en:"<b>Guard your tongue and gaze</b> — avoid idle talk, phone use, or looking around on the way; stay occupied with remembrance.",
   ur:"<b>اپنی زبان اور نظر کا لحاظ</b> — راستے میں فضول باتیں، موبائل کا استعمال یا اِدھر اُدھر دیکھنے سے بچیں، ذکر میں مشغول رہیں۔"},
  {rm:"<b>Wapsi par shukr</b> — gasht se wapas aakar Allah ka shukr ada karein, natije ki fikr Allah par chhod dein.",
   en:"<b>Gratitude on return</b> — after returning from gasht, thank Allah, and leave the outcome to Him.",
   ur:"<b>واپسی پر شکر</b> — گشت سے واپس آ کر اللہ کا شکر ادا کریں، نتیجے کی فکر اللہ پر چھوڑ دیں۔"}
];

let currentLang = 'rm';

function renderGasht(){
  const ul = document.getElementById('gashtList');
  ul.innerHTML = GASHT_LIST.map((item,i) =>
    `<li><span class="adab-num">${i+1}</span><span>${item[currentLang]}</span></li>`
  ).join('');
}

function renderFaq(){
  const wrap = document.getElementById('faqList');
  wrap.innerHTML = FAQ_LIST.map((item,i) => `
    <div class="faq-item${i===0?' open':''}">
      <div class="faq-q"><div class="faq-mark">+</div><p>${item.q[currentLang]}</p></div>
      <div class="faq-a"><div class="faq-a-inner">${item.a[currentLang]}</div></div>
    </div>`).join('');
  document.querySelectorAll('.faq-item').forEach(el => {
    el.querySelector('.faq-q').addEventListener('click', () => el.classList.toggle('open'));
  });
}

function applyLang(lang){
  currentLang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if(I18N[key]) el.innerHTML = I18N[key][lang] || I18N[key].rm;
  });
  document.body.classList.remove('lang-rm','lang-en','lang-ur');
  document.body.classList.add('lang-' + lang);
  document.getElementById('htmlRoot').setAttribute('dir', lang === 'ur' ? 'rtl' : 'ltr');
  document.getElementById('htmlRoot').setAttribute('lang', lang === 'ur' ? 'ur' : 'en');
  document.querySelectorAll('.lang-switch button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  renderGasht();
  renderFaq();
}

document.querySelectorAll('.lang-switch button').forEach(btn => {
  btn.addEventListener('click', () => applyLang(btn.dataset.lang));
});

const navButtons = document.querySelectorAll('nav.bottom button, [data-nav]');
function goTo(pageKey){
  document.querySelectorAll('section.page').forEach(s => s.classList.remove('active'));
  document.getElementById('page-' + pageKey).classList.add('active');
  document.querySelectorAll('nav.bottom button').forEach(b => b.classList.toggle('active', b.dataset.nav === pageKey));
  document.getElementById('main').scrollTo({top:0, behavior:'instant'});
}
navButtons.forEach(el => {
  el.addEventListener('click', () => goTo(el.dataset.nav));
});

document.querySelectorAll('[data-sifat]').forEach(card => {
  card.querySelector('.sifat-head').addEventListener('click', () => {
    card.classList.toggle('open');
  });
});

applyLang('rm');

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>

</body>
</html>
